name: My project deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update repository
        working-directory: /home/halahanaqtah/FinalProject-HTU
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Newman Test
        working-directory: /home/halahanaqtah/FinalProject-HTU
        run: newman run DummyJson.json -e Environment.json -d UsersData.csv

      - name: K6 Smoke Test
        working-directory: /home/halahanaqtah/FinalProject-HTU
        run: k6 run Final_K6/SmokeTest.js
        
      - name: CPU status
        working-directory: /home/halahanaqtah/FinalProject-HTU
        run: w

      - name: Ram status
        working-directory: /home/halahanaqtah/FinalProject-HTU

        run: free -h



